name: solar-system-ci
on:
  push:
    branches: [main,feat]
env:
    MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit-testing:
        # strategy:
        #   matrix:
        #     node-version: [18,19]
        #     os: [ubuntu-latest, windows-latest]
        #     exclude:
        #       - node-version: 19
        #         os: windows-latest
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v6
          - name: set up nodejs 
            uses: actions/setup-node@v6
            with:
              node-version: 18
          - name: cache node modules
            uses: actions/cache@v5
            with:
              path: node_modules
              key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          - name: install dependencies
            run: npm install
          - name: run tests
            run: npm test
          - name: uploading artifacts
            if: always()
            uses: actions/upload-artifact@v7
            with:
                name: my-artifact
                path: test-results.xml
                

    code-coverage:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v6
          - name: set up nodejs
            uses: actions/setup-node@v6
            with:
              node-version: 18
          - name: cache node modules
            uses: actions/cache@v5
            with:
              path: node_modules
              key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          - name: install dependencies
            run: npm install
          - name: run tests with coverage
            continue-on-error: true
            run: npm run coverage
          - name: uploading coverage report
            uses: actions/upload-artifact@v7
            with:
                name: coverage-report
                path: coverage/
                retention-days: 5
    
    docker:
        needs: [unit-testing, code-coverage]
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v6
          - name: Docker login
            uses: docker/login-action@v4
            with:
              username: ${{ vars.docker_username }}
              password: ${{ secrets.docker_password }}

          # - name: Set up Docker Buildx
          #   uses: docker/setup-buildx-action@v4
        
          - name: Build Docker image
            uses: docker/build-push-action@v7
            with:
              context: .
              # file: ./Dockerfile
              push: false
              tags: ${{ vars.docker_username }}/solar-system-app:${{ github.sha }}

          - name: docker test
            run: |
              docker run --name solar-system -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
              -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
              --rm ${{ vars.docker_username }}/solar-system-app:${{ github.sha }}
            
              echo "testing docker container..."
              wget -q -O - 127.0.0.1:3000/live | grep live
          
          - name: push Docker image
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true
              tags: ${{ vars.docker_username }}/solar-system-app:${{ github.sha }}